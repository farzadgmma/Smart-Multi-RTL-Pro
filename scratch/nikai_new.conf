# MobtakerAI main domain — migrated to v2 backend/frontend (ports 3001/8001)
# Previously proxied to v1 (ports 3000/8000) which is decommissioned.
server {
    server_name mobtakerai.ir www.mobtakerai.ir;

    client_max_body_size 50M;

    # Backend API (FastAPI v2 on port 8001)
    location /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Static uploads (served by FastAPI v2)
    location /uploads/ {
        proxy_pass http://127.0.0.1:8001/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # News app mini app (keep existing /newsapp/ proxy)
    location /newsapp/ {
        proxy_pass http://127.0.0.1:8082/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Frontend (Next.js v2 on port 3001)
    location / {
        proxy_pass http://127.0.0.1:2030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/mobtakerai.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mobtakerai.ir/privkey.pem;
    
    # Multi-RTL Pro Extension Download & Backend Endpoints
    location /ChromeExtantion/ {
        alias /var/www/chrome-extensions/;
        autoindex off;
    }
    location = /api/register-user {
        proxy_pass http://127.0.0.1:8085/api/register-user;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /api/admin-users {
        proxy_pass http://127.0.0.1:8085/api/admin-users;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP → HTTPS redirect
server {
    if ($host = mobtakerai.ir) {
        return 301 https://$host$request_uri;
    }
    if ($host = www.mobtakerai.ir) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name mobtakerai.ir www.mobtakerai.ir;
    return 404;
}
